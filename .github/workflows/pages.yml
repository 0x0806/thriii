name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run check
      - name: Build static site
        run: npm run build:pages
      - name: Smoke test the build
        run: |
          set -e
          out=dist/public
          for f in index.html 404.html sitemap.xml robots.txt CNAME manifest.webmanifest brochure.pdf; do
            test -s "$out/$f" || { echo "missing $f"; exit 1; }
          done
          # a root-absolute asset URL would break under github.io/<repo>/
          if grep -Eq '(src|href)="/(assets|favicon|logo)' "$out/index.html"; then echo "absolute asset path in index.html"; exit 1; fi
          grep -q "<loc>https://thriiievents.com/</loc>" "$out/sitemap.xml"
          grep -q "^Sitemap: https://thriiievents.com/sitemap.xml" "$out/robots.txt"
          grep -q 'rel="canonical"' "$out/index.html"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
